name: Daily Summary Bot

on:
  workflow_dispatch:

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        run: python bot.py

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: daily-summary
          path: daily_summary.txt
